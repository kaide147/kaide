<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失物招领 - 物品查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 30px;
        }

        .top {
            max-width: 1100px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            background: #fff;
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px #ddd;
        }

        .search-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
            min-width: 180px;
        }

        button {
            padding: 10px 26px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #3498db;
            color: #fff;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="top">
        <h2>物品信息查询</h2>
        <a href="index.html">返回首页</a>
    </div>

    <div class="search-box">
        <div class="search-row">
            <input type="text" id="key" placeholder="输入物品名称搜索">
            <select id="type">
                <option value="">全部类型</option>
                <option value="lost">遗失物品</option>
                <option value="found">捡到物品</option>
            </select>
            <button onclick="searchData()">搜索查询</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>物品名称</th>
                    <th>类型</th>
                    <th>地点</th>
                    <th>时间</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!--后端数据加载位置-->
                <tr>
                    <td colspan="6">暂无公示数据</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        //搜索功能
        function searchData() {
            let key = document.getElementById("key").value;
            let type = document.getElementById("type").value;
            alert("搜索成功！关键词：" + key);
            //后续对接java后端数据
        }
    </script>

</body>

</html>
