<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失物招领系统 - 学生注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-box {
            width: 450px;
            padding: 40px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .register-box h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .input-box {
            position: relative;
            margin-bottom: 30px;
        }

        .input-box input {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: #333;
            border: none;
            border-bottom: 1px solid #666;
            outline: none;
            background: transparent;
        }

        .input-box label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px 0;
            font-size: 16px;
            color: #666;
            pointer-events: none;
            transition: 0.5s;
        }

        .input-box input:focus~label,
        .input-box input:valid~label {
            top: -20px;
            left: 0;
            color: #3498db;
            font-size: 12px;
        }

        .btn-register {
            width: 100%;
            height: 40px;
            background: #3498db;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-register:hover {
            background: #2980b9;
        }

        .link-box {
            text-align: center;
            margin-top: 20px;
        }

        .link-box a {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }

        .link-box a:hover {
            text-decoration: underline;
        }

        .tip {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="register-box">
        <h2>学生注册</h2>
        <form id="registerForm">
            <div class="input-box">
                <input type="text" name="username" required>
                <label>学号/用户名</label>
            </div>
            <div class="input-box">
                <input type="text" name="realName" required>
                <label>真实姓名</label>
            </div>
            <div class="input-box">
                <input type="password" name="password" required id="pwd">
                <label>密码</label>
                <p class="tip">密码长度不少于6位</p>
            </div>
            <div class="input-box">
                <input type="password" name="repassword" required id="repwd">
                <label>确认密码</label>
            </div>
            <div class="input-box">
                <input type="text" name="phone">
                <label>联系电话</label>
            </div>
            <button type="submit" class="btn-register">注册</button>
            <div class="link-box">
                <a href="login.html">已有账号？去登录</a>
                <span style="margin: 0 10px;">|</span>
                <a href="index.html">返回首页</a>
            </div>
        </form>
    </div>

    <script>
        // 注册表单提交事件（后续对接Java后端接口）
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault(); // 阻止表单默认提交
            const formData = new FormData(this);
            const username = formData.get('username');
            const realName = formData.get('realName');
            const password = formData.get('password');
            const repassword = formData.get('repassword');
            const phone = formData.get('phone');

            // 前端基础校验
            if (!username || !realName || !password || !repassword) {
                alert('请填写必填项！');
                return;
            }
            if (password.length < 6) {
                alert('密码长度不能少于6位！');
                return;
            }
            if (password !== repassword) {
                alert('两次输入的密码不一致！');
                return;
            }

            // 这里后续会替换为：fetch请求后端注册接口
            // 示例：fetch('/api/user/register', { method: 'POST', body: formData })
            alert(`注册成功！用户名：${username}，请去登录`);
            // 注册成功后跳转到登录页
            window.location.href = 'login.html';
        });
    </script>
</body>

</html>
