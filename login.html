<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失物招领系统 - 学生登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 400px;
            padding: 40px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .login-box h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .input-box {
            position: relative;
            margin-bottom: 30px;
        }

        .input-box input {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: #333;
            border: none;
            border-bottom: 1px solid #666;
            outline: none;
            background: transparent;
        }

        .input-box label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px 0;
            font-size: 16px;
            color: #666;
            pointer-events: none;
            transition: 0.5s;
        }

        .input-box input:focus~label,
        .input-box input:valid~label {
            top: -20px;
            left: 0;
            color: #3498db;
            font-size: 12px;
        }

        .btn-login {
            width: 100%;
            height: 40px;
            background: #3498db;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background: #2980b9;
        }

        .link-box {
            text-align: center;
            margin-top: 20px;
        }

        .link-box a {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }

        .link-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>学生登录</h2>
        <form id="loginForm">
            <div class="input-box">
                <input type="text" name="username" required>
                <label>学号/用户名</label>
            </div>
            <div class="input-box">
                <input type="password" name="password" required>
                <label>密码</label>
            </div>
            <button type="submit" class="btn-login">登录</button>
            <div class="link-box">
                <a href="register.html">还没有账号？去注册</a>
                <span style="margin: 0 10px;">|</span>
                <a href="index.html">返回首页</a>
            </div>
        </form>
    </div>

    <script>
        // 登录表单提交事件（后续对接Java后端接口）
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault(); // 阻止表单默认提交
            const formData = new FormData(this);
            const username = formData.get('username');
            const password = formData.get('password');

            // 临时本地验证（正式环境会替换为后端接口请求）
            if (!username || !password) {
                alert('请输入用户名和密码！');
                return;
            }

            // 这里后续会替换为：fetch请求后端登录接口
            // 示例：fetch('/api/user/login', { method: 'POST', body: formData })
            alert(`登录成功！用户名：${username}`);
            // 登录成功后跳转到学生首页
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
