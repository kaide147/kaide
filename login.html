<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑"
        }

        .top {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px
        }

        .nav {
            display: flex;
            background: #34495e
        }

        .nav a {
            color: white;
            padding: 15px 30px;
            text-decoration: none
        }

        .nav a:hover {
            background: #2c3e50
        }

        .container {
            padding: 30px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center
        }

        th {
            background: #3498db;
            color: #fff
        }

        .btn {
            padding: 6px 12px;
            border: none;
            color: white;
            border-radius: 3px;
            cursor: pointer;
            margin: 2px
        }

        .pass {
            background: #27ae60
        }

        .del {
            background: #e74c3c
        }
    </style>
</head>

<body>
    <div class="top">校园失物招领系统 — 管理员后台</div>
    <div class="nav">
        <a href="">待审核信息</a>
        <a href="">已发布管理</a>
        <a href="">学生用户管理</a>
        <a href="../index.html">退出首页</a>
    </div>

    <div class="container">
        <h3>待审核发布列表</h3>
        <br>
        <table>
            <tr>
                <th>物品名称</th>
                <th>类型</th>
                <th>发布人</th>
                <th>联系方式</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
            <tr>
                <td>学生卡</td>
                <td>遗失</td>
                <td>张三</td>
                <td>13800138000</td>
                <td>待审核</td>
                <td>
                    <button class="btn pass">通过</button>
                    <button class="btn del">删除</button>
                </td>
            </tr>
        </table>
    </div>

    <script>
        //审核按钮模拟
        document.querySelectorAll(".pass")[0].onclick = function () {
            alert("审核通过！前台展示");
            location.reload();
        }
        document.querySelectorAll(".del")[0].onclick = function () {
            alert("删除成功");
            location.reload();
        }
    </script>
</body>

</html>
